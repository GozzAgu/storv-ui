<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- CRITICAL: Apply theme IMMEDIATELY - blocking script that runs before rendering -->
    <script>
      !function() {
        'use strict';
        var html = document.documentElement;
        var theme, isDark = false;
        
        try {
          theme = localStorage.getItem('theme');
          
          if (theme === 'dark') {
            isDark = true;
          } else if (theme === 'light') {
            isDark = false;
          } else {
            // theme is 'system', null, or undefined - check system preference
            try {
              if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                isDark = true;
              }
            } catch(e) {
              isDark = false;
            }
          }
        } catch(e) {
          // localStorage access failed - check system preference
          try {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              isDark = true;
            }
          } catch(e2) {
            isDark = false;
          }
        }
        
        // Apply theme class SYNCHRONOUSLY before any rendering
        if (isDark) {
          html.className = (html.className ? html.className + ' ' : '') + 'dark';
        } else {
          html.className = html.className.replace(/\s*dark\s*/g, ' ').trim();
        }
      }();
    </script>
    
    <!-- CRITICAL: Block ALL rendering until styles load - SIMPLE & AGGRESSIVE -->
    <style id="fouc-blocker">
      /* Hide everything until styles are loaded - use display:none for complete hiding */
      html:not(.styles-loaded) { 
        display: none !important;
      }
      html:not(.styles-loaded) body { 
        display: none !important;
      }
      /* Reveal when ready */
      html.styles-loaded { 
        display: block !important;
        opacity: 1 !important; 
        transition: opacity 0.15s ease-in;
      }
      html.styles-loaded body { 
        display: block !important;
        opacity: 1 !important; 
      }
      /* Background colors */
      html.dark { background-color: #111827 !important; }
      html:not(.dark) { background-color: #ffffff !important; }
      body { 
        background-color: inherit !important; 
        margin: 0 !important; 
        padding: 0 !important; 
      }
      /* Critical layout */
      #__nuxt { 
        min-height: 100vh; 
        width: 100%; 
        position: relative; 
        overflow-x: hidden; 
      }
      * { box-sizing: border-box; }
    </style>
    
    <!-- SIMPLE & RELIABLE: Hide immediately, reveal when window loads -->
    <script>
      (function() {
        'use strict';
        var html = document.documentElement;
        var revealed = false;
        
        // HIDE IMMEDIATELY - before anything renders - use display:none
        html.style.cssText = 'display: none !important;';
        
        // Hide body as soon as it exists
        function hideBody() {
          if (document.body) {
            document.body.style.cssText = 'display: none !important;';
          }
        }
        hideBody();
        
        // Watch for body creation
        if (document.readyState === 'loading') {
          var bodyObserver = new MutationObserver(function() {
            if (document.body) {
              hideBody();
              bodyObserver.disconnect();
          }
          });
          bodyObserver.observe(document.documentElement, { childList: true, subtree: true });
        }
        
        function reveal() {
          if (revealed) return;
          revealed = true;
          html.classList.add('styles-loaded');
          html.style.removeProperty('display');
          if (document.body) {
            document.body.style.removeProperty('display');
        }
        }
        
        // Test Tailwind is working
        function testTailwind() {
          try {
            if (!document.body) return false;
            var test = document.createElement('div');
            test.className = 'flex';
            test.style.cssText = 'position:absolute;visibility:hidden;top:-9999px;';
            document.body.appendChild(test);
            var style = window.getComputedStyle(test);
            var works = style.display === 'flex' || style.display === '-webkit-box';
            document.body.removeChild(test);
            return works;
          } catch(e) {
            return false;
          }
        }
        
        // Wait for window load (all resources including CSS)
        window.addEventListener('load', function() {
          // Check Tailwind multiple times
          var attempts = 0;
          var maxAttempts = 20; // 1 second total
          var checkInterval = setInterval(function() {
            attempts++;
            if (testTailwind() || attempts >= maxAttempts) {
              clearInterval(checkInterval);
              reveal();
            }
          }, 50);
        }, {once: true});
        
        // DOMContentLoaded fallback - start checking earlier
        document.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            if (!revealed) {
              var attempts = 0;
              var maxAttempts = 30; // 1.5 seconds
              var checkInterval = setInterval(function() {
                attempts++;
                if (testTailwind() || attempts >= maxAttempts) {
                  clearInterval(checkInterval);
                  if (!revealed) reveal();
                }
              }, 50);
            }
          }, 300);
        }, {once: true});
        
        // Absolute safety fallback - never hide forever
        setTimeout(function() {
          if (!revealed) reveal();
        }, 2000);
      })();
    </script>
    
    {{ HEAD }}
  </head>
  <body>
    {{ APP }}
  </body>
</html>
